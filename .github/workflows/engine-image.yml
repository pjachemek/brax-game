# Builds and publishes the engine container image.
#
# The image is the deployable unit for k3s; this workflow is the only thing that
# should produce a tagged one. Nothing here touches the apps: a change under
# apps/** cannot ship a new engine, and the path filter says so.
name: engine-image

on:
  push:
    branches: [main]
    tags: ['engine-v*']
    paths:
      - 'packages/engine/**'
      - 'services/engine-api/**'
      - '.github/workflows/engine-image.yml'
  pull_request:
    paths:
      - 'packages/engine/**'
      - 'services/engine-api/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/re-checkers-engine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The rules suite and the transport-parity suite both gate the image: a
      # local and a hosted engine must not be able to drift.
      - run: npm test
      - run: npm run lint

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Pull requests build the image to prove it still builds, but publish
        # nothing — a fork must not be able to push to the registry.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=match,pattern=engine-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          # The engine imports packages/engine as a sibling, so the context is
          # the repo root and the Dockerfile is addressed inside it.
          context: .
          file: services/engine-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
